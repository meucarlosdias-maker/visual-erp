services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visual-erp-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-password}@db:5432/visual-erp-prod
      - DIRECT_URL=postgresql://postgres:${DB_PASSWORD:-password}@db:5432/visual-erp-prod
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - visual-erp-network

  db:
    image: postgres:16-alpine
    container_name: visual-erp-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: visual-erp-prod
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - visual-erp-network

volumes:
  postgres-data:
    name: visual-erp-postgres-data

networks:
  visual-erp-network:
    name: visual-erp-network
    driver: bridge
